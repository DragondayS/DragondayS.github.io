<div id="particles-js" aria-hidden="true"></div>

{{- $particlesScript := resources.Get "background/particles.min.js" -}}
{{- $particlesConfig := resources.Get "background/particlesjs-config.json" -}}
{{- if and $particlesScript $particlesConfig -}}
<script src="{{ $particlesScript.RelPermalink }}"></script>
<script>
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    particlesJS.load('particles-js', '{{ $particlesConfig.RelPermalink }}');
  }
</script>
{{- end -}}

<style>
  #particles-js {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  body {
    background: rgba(245, 245, 250, 0.85) !important;
  }

  [data-scheme="dark"] body {
    background: rgba(48, 48, 48, 0.85) !important;
  }

  @media (prefers-reduced-motion: reduce) {
    #particles-js {
      display: none;
    }
  }
</style>
